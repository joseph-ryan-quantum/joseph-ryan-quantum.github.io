name: Build CV

on:
  push:
    branches: [main]
    paths:
      - "cv/**"
      - "scripts/build_cv.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended pandoc

      - name: Build CV
        run: ./scripts/build_cv.sh

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files/cv.pdf _includes/cv-generated.html
          git diff --cached --quiet || git commit -m "Rebuild CV from cv/main.tex [skip ci]"
          git push
